<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #04041a;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    cursor: crosshair;
    background: #04041a;
  }
</style>
