<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AMBLAST — gem block puzzle</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #04041a;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    cursor: crosshair;
    background: #04041a;
    /* Without this, a phone treats a drag as a scroll/zoom gesture and the
       browser steals the pointer mid-drag, so pieces stop following the finger. */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
